<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archivo Claro – Prototipo</title>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--ink:#1b2735;--muted:#556577;--line:#cfd7e0;--accent:#1f5f8b;--accent-ink:#fff;
--ok-bg:#e1f2e6;--ok:#1d6b3a;--warn-bg:#fdecd2;--warn:#8a4b00;--bad-bg:#fbe3e3;--bad:#9b1c1c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a23;--surface:#1a2430;--ink:#e6edf4;--muted:#9fb0c1;--line:#2e3b4a;--accent:#6db3e8;--accent-ink:#0b1b29;
--ok-bg:#17331f;--ok:#7ed59a;--warn-bg:#3b2a10;--warn:#f2c078;--bad-bg:#3c1c1c;--bad:#f29b9b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a23;--surface:#1a2430;--ink:#e6edf4;--muted:#9fb0c1;--line:#2e3b4a;--accent:#6db3e8;--accent-ink:#0b1b29;
--ok-bg:#17331f;--ok:#7ed59a;--warn-bg:#3b2a10;--warn:#f2c078;--bad-bg:#3c1c1c;--bad:#f29b9b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.brand{font-family:Georgia,"Times New Roman",serif;line-height:1.2}
h1{font-size:1.85rem;margin:.4rem 0 1rem}h1:focus{outline:none}
h2{font-size:1.2rem;margin:1.6rem 0 .6rem}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:780px;margin:0 auto;padding:.7rem 1rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:1.25rem;font-weight:700;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:.55rem}
.brand i{width:26px;height:20px;border:2px solid var(--accent);border-top-width:6px;border-radius:3px}
nav a{margin-left:1rem;color:var(--ink);padding:.3rem 0}
main{max-width:780px;margin:0 auto;padding:1rem 1rem 3rem}
.crumbs{font-size:.9rem;color:var(--muted)}
.crumbs a{color:var(--muted)}
label{display:block;font-weight:600;margin:.9rem 0 .3rem}
input,select,textarea{width:100%;font:inherit;padding:.7rem .8rem;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-height:48px}
.btn{display:inline-block;font:inherit;font-weight:600;padding:.75rem 1.2rem;min-height:48px;border-radius:6px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;cursor:pointer}
.btn.sec{background:transparent;color:var(--accent)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.1rem}
.search{display:flex;gap:.6rem;flex-wrap:wrap}.search input{flex:1 1 260px}
.hint,.muted{color:var(--muted);font-size:.95rem}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
.filters label{margin:.3rem 0 .2rem;font-size:.9rem}
.card{display:block;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:.9rem 1rem;margin:.7rem 0;text-decoration:none;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card b{font-family:Georgia,serif;font-size:1.1rem}
.badge{display:inline-block;font-weight:600;font-size:.88rem;padding:.15rem .6rem;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:1rem}
dl{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1.2rem;margin:0}
dt{color:var(--muted)}dd{margin:0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:320px;margin:.6rem 0}
.grid span{border:1.5px solid var(--line);border-radius:4px;text-align:center;font-size:.85rem;padding:.35rem 0;color:var(--muted)}
.grid span.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.msg{border-left:5px solid var(--ok);background:var(--ok-bg);color:var(--ink);padding:.7rem 1rem;border-radius:4px;margin:.8rem 0;display:flex;gap:.8rem;justify-content:space-between;align-items:center;flex-wrap:wrap}
.msg.warn{border-color:var(--warn);background:var(--warn-bg)}
.err{color:var(--bad);font-weight:600;margin:.3rem 0 0}
ol.steps{display:flex;gap:.5rem;list-style:none;padding:0;margin:.4rem 0 1rem;flex-wrap:wrap}
ol.steps li{padding:.25rem .8rem;border:1.5px solid var(--line);border-radius:999px;font-size:.92rem;color:var(--muted)}
ol.steps li[aria-current]{border-color:var(--accent);color:var(--ink);font-weight:700}
ul.hist{list-style:none;padding:0;margin:0}ul.hist li{padding:.4rem 0;border-bottom:1px solid var(--line)}
.sr{position:absolute;left:-9999px}
footer{max-width:780px;margin:0 auto;padding:0 1rem 2rem;color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="#inicio"><i aria-hidden="true"></i>Archivo Claro</a>
<nav aria-label="Principal"><a href="#inicio">Inicio</a><a href="#explorar">Explorar archivo</a></nav></div></header>
<main id="app" aria-live="polite"></main>
<footer>Prototipo de media fidelidad con datos ficticios. Unidad 2 – Interacción Humano Computador, Universidad Mayor.</footer>
<script>
const HOY='15-11-2026';
const D=[
{id:'OF-0123',t:'Oficio 0123',tipo:'Oficio',a:2021,cas:'05',car:12,ini:'03-02-2021',fin:'28-02-2021',e:'Disponible',v:'10-11-2026',h:[{f:'18-03-2021',x:'Salida registrada'},{f:'25-03-2021',x:'Devolución registrada'}]},
{id:'OF-0124',t:'Oficio 0124',tipo:'Oficio',a:2021,cas:'05',car:12,ini:'01-03-2021',fin:'31-03-2021',e:'Retirado',v:'10-11-2026',who:'Oficina de operaciones',desde:'05-11-2026',h:[{f:'05-11-2026',x:'Salida registrada: Oficina de operaciones'}]},
{id:'IN-0310',t:'Informe 0310',tipo:'Informe',a:2022,cas:'07',car:3,ini:'05-01-2022',fin:'20-01-2022',e:'Disponible',v:'08-11-2026',h:[]},
{id:'IN-0311',t:'Informe 0311',tipo:'Informe',a:2022,cas:'07',car:3,ini:'21-01-2022',fin:'10-02-2022',e:'Retirado',v:'08-11-2026',who:'Jefatura de turno',desde:'02-11-2026',h:[{f:'02-11-2026',x:'Salida registrada: Jefatura de turno'}]},
{id:'RE-0045',t:'Resolución 0045',tipo:'Resolución',a:2019,cas:'01',car:8,ini:'12-06-2019',fin:'30-06-2019',e:'No ubicado',v:'02-03-2026',h:[{f:'02-03-2026',x:'Última verificación física'}]},
{id:'LI-0008',t:'Libro de novedades 2020',tipo:'Libro',a:2020,cas:'01',car:2,ini:'01-01-2020',fin:'31-12-2020',e:'Disponible',v:'10-11-2026',h:[]}];
const S={q:'',tipo:'',est:'',anio:'',cas:'',cur:null,msg:null,undo:null,form:{sol:'',fecha:'2026-11-15',mot:''},err:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur=()=>D.find(d=>d.id===S.cur)||D[0];
const fmt=f=>f.split('-').reverse().join('-');
const badge=e=>e==='Disponible'?'<span class="badge b-ok">✓ Disponible</span>':e==='Retirado'?'<span class="badge b-warn">↗ Retirado</span>':'<span class="badge b-bad">! No ubicado</span>';
const steps=n=>'<ol class="steps" aria-label="Pasos del registro">'+['Datos','Resumen','Confirmación'].map((x,i)=>`<li${i===n?' aria-current="step"':''}>${i+1}. ${x}</li>`).join('')+'</ol>';
const crumbs=a=>'<p class="crumbs">'+a.map(([h,t])=>h?`<a href="${h}">${t}</a>`:t).join(' › ')+'</p>';
function filtered(){const q=S.q.trim().toLowerCase();
return D.filter(d=>(!q||(d.t+' '+d.id+' '+d.tipo+' '+d.a).toLowerCase().includes(q))&&(!S.tipo||d.tipo===S.tipo)&&(!S.est||d.e===S.est)&&(!S.anio||String(d.a)===S.anio)&&(!S.cas||d.cas===S.cas));}
function card(d){return `<a class="card" href="#ficha" data-open="${d.id}"><div class="top"><b>${d.t}</b>${badge(d.e)}</div>
<div class="muted">${d.tipo} · ${d.a} · Casillero ${d.cas}, carpeta ${d.car}${d.e==='Retirado'?' · Retirado desde '+d.desde:''}</div></a>`;}
function list(){const r=filtered();
if(!r.length)return `<div class="panel"><p><b>No encontramos documentos con esos filtros.</b></p><p class="muted">Pruebe con menos filtros o reporte un documento que no esté en el índice.</p><button class="btn sec" data-act="limpiar">Quitar filtros</button></div>`;
return `<p class="muted" role="status">${r.length} ${r.length===1?'documento encontrado':'documentos encontrados'}</p>`+r.map(card).join('');}
function opts(arr,v){return '<option value="">Todos</option>'+arr.map(x=>`<option${String(x)===v?' selected':''}>${x}</option>`).join('');}
const V={
inicio(){const n=D.filter(d=>d.e==='Retirado').length;
return `<h1 tabindex="-1">¿Qué documento busca?</h1>
<form class="search" id="fb" role="search"><label class="sr" for="q">Buscar documento</label><input id="q" placeholder="Ej.: Oficio 0123, informe 2022" autocomplete="off"><button class="btn">Buscar documento</button></form>
<p class="hint">Puede buscar por número, tipo de documento o año.</p>
<h2>Accesos rápidos</h2><div class="row"><a class="btn sec" href="#explorar">Explorar archivo</a><button class="btn sec" data-act="retirados">Retirados sin devolver (${n})</button></div>`;},
resultados(){return crumbs([['#inicio','Inicio'],[null,'Resultados']])+`<h1 tabindex="-1">Resultados</h1>
<label for="q">Buscar documento</label><input id="q" value="${esc(S.q)}" placeholder="Número, tipo o año">
<div class="filters"><div><label for="ft">Tipo de documento</label><select id="ft">${opts(['Oficio','Informe','Resolución','Libro'],S.tipo)}</select></div>
<div><label for="fe">Estado</label><select id="fe">${opts(['Disponible','Retirado','No ubicado'],S.est)}</select></div>
<div><label for="fa">Año</label><select id="fa">${opts([2019,2020,2021,2022],S.anio)}</select></div></div>
${S.cas?`<p class="muted">Casillero ${S.cas} <button class="btn sec" data-act="quitarcas" style="min-height:36px;padding:.2rem .7rem">Quitar</button></p>`:''}
<div id="lst">${list()}</div>`;},
ficha(){const d=cur();const g=Array.from({length:12},(_,i)=>`<span class="${i+1===d.car?'on':''}">${i+1}</span>`).join('');
const acc=d.e==='Disponible'?'<a class="btn" href="#salida">Registrar salida</a>':d.e==='Retirado'?'<button class="btn" data-act="devolver">Registrar devolución</button>':'<button class="btn" data-act="noenc">Reportar documento no encontrado</button>';
const m=S.msg?`<div class="msg${S.msg.w?' warn':''}" role="status"><span>${S.msg.t}</span>${S.undo?'<button class="btn sec" data-act="deshacer" style="min-height:36px;padding:.2rem .8rem">Deshacer</button>':''}</div>`:'';
return crumbs([['#inicio','Inicio'],['#resultados','Resultados'],[null,'Ficha']])+`<div class="top"><h1 tabindex="-1">${d.t}</h1>${badge(d.e)}</div>${m}
<div class="panel"><dl><dt>Ubicación</dt><dd><b>Casillero ${d.cas}, carpeta ${d.car}</b></dd><dt>Tipo</dt><dd>${d.tipo}</dd><dt>Fechas</dt><dd>${d.ini} al ${d.fin}</dd>
<dt>Última verificación</dt><dd>${d.v}</dd>${d.e==='Retirado'?`<dt>Lo tiene</dt><dd>${d.who} desde ${d.desde}</dd>`:''}</dl>
<div class="grid" role="img" aria-label="Carpeta ${d.car} del casillero ${d.cas}">${g}</div><p class="hint">Carpetas del casillero ${d.cas}; la resaltada es la de este documento.</p></div>
<div class="row">${acc}${d.e!=='No ubicado'?'<button class="btn sec" data-act="disc">Reportar discrepancia</button>':''}</div>
<h2>Historial de movimientos</h2>${d.h.length?'<ul class="hist">'+d.h.map(x=>`<li><b>${x.f}</b> · ${esc(x.x)}</li>`).join('')+'</ul>':'<p class="muted">Aún no hay movimientos registrados.</p>'}`;},
salida(){const d=cur(),f=S.form;
return crumbs([['#inicio','Inicio'],['#ficha',d.t],[null,'Registrar salida']])+steps(0)+`<h1 tabindex="-1">Registrar salida</h1><p class="muted">${d.t} · Casillero ${d.cas}, carpeta ${d.car}</p>
<form id="fs" novalidate><label for="sol">¿Quién retira el documento?</label><input id="sol" value="${esc(f.sol)}" placeholder="Nombre o unidad solicitante"${S.err?' aria-invalid="true" aria-describedby="e1"':''}>
${S.err?`<p class="err" id="e1">${S.err}</p>`:''}
<label for="fec">Fecha de salida</label><input id="fec" type="date" value="${f.fecha}">
<label for="mot">Motivo (opcional)</label><textarea id="mot" rows="2">${esc(f.mot)}</textarea>
<div class="row"><a class="btn sec" href="#ficha">Volver</a><button class="btn">Continuar</button></div></form>`;},
resumen(){const d=cur(),f=S.form;
return crumbs([['#inicio','Inicio'],['#ficha',d.t],[null,'Resumen']])+steps(1)+`<h1 tabindex="-1">Revise los datos</h1><div class="panel"><dl><dt>Documento</dt><dd>${d.t}</dd><dt>Ubicación</dt><dd>Casillero ${d.cas}, carpeta ${d.car}</dd>
<dt>Retira</dt><dd>${esc(f.sol)}</dd><dt>Fecha</dt><dd>${fmt(f.fecha)}</dd><dt>Motivo</dt><dd>${f.mot?esc(f.mot):'Sin motivo indicado'}</dd></dl></div>
<div class="row"><a class="btn sec" href="#salida">Volver y corregir</a><button class="btn" data-act="confirmar">Confirmar salida</button></div>`;},
confirmacion(){const d=cur(),f=S.form;
return steps(2)+`<h1 tabindex="-1">La salida del documento fue registrada correctamente</h1>${S.msg?`<div class="msg warn" role="status">${S.msg.t}</div>`:''}
<div class="panel"><dl><dt>Documento</dt><dd>${d.t}</dd><dt>Retirado por</dt><dd>${esc(f.sol)}</dd><dt>Fecha</dt><dd>${fmt(f.fecha)}</dd><dt>Próximo paso</dt><dd>Registrar la devolución cuando el documento vuelva al archivo.</dd></dl></div>
<div class="row"><button class="btn" data-act="comprobante">Descargar comprobante</button><a class="btn sec" href="#inicio">Volver al inicio</a></div>`;},
explorar(){const c={};D.forEach(d=>c[d.cas]=(c[d.cas]||0)+1);
return crumbs([['#inicio','Inicio'],[null,'Explorar archivo']])+`<h1 tabindex="-1">Explorar archivo</h1><p class="muted">Elija un casillero para ver los documentos que contiene.</p>`+
Object.keys(c).sort().map(k=>`<a class="card" href="#resultados" data-cas="${k}"><div class="top"><b>Casillero ${k}</b><span class="muted">${c[k]} documentos</span></div></a>`).join('');}
};
function route(){const r=(location.hash||'#inicio').slice(1);
if((r==='resumen'||r==='confirmacion')&&!S.form.sol.trim()){location.hash='#salida';return;}
$('#app').innerHTML=(V[r]||V.inicio)();const h=$('#app h1');if(h)h.focus({preventScroll:false});window.scrollTo(0,0);
if(r!=='ficha'&&r!=='confirmacion'){S.msg=null;S.undo=null;}}
function relist(){$('#lst').innerHTML=list();}
document.addEventListener('click',e=>{
const o=e.target.closest('[data-open]');if(o){S.cur=o.dataset.open;S.msg=null;S.undo=null;S.form={sol:'',fecha:'2026-11-15',mot:''};return;}
const c=e.target.closest('[data-cas]');if(c){S.cas=c.dataset.cas;S.q=S.tipo=S.est=S.anio='';return;}
const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=cur();
if(a==='limpiar'){S.q=S.tipo=S.est=S.anio=S.cas='';route();}
if(a==='quitarcas'){S.cas='';route();}
if(a==='retirados'){S.q=S.tipo=S.anio=S.cas='';S.est='Retirado';location.hash='#resultados';}
if(a==='devolver'){d.e='Disponible';const w=d.who,ds=d.desde;d.h.unshift({f:HOY,x:'Devolución registrada'});
S.msg={t:`La devolución de ${d.t} fue registrada correctamente.`};S.undo=()=>{d.e='Retirado';d.who=w;d.desde=ds;d.h.shift();};route();}
if(a==='deshacer'){S.undo&&S.undo();S.undo=null;S.msg={t:'Se deshizo la devolución.',w:1};route();}
if(a==='disc'){S.msg={t:'Discrepancia reportada. La jefatura podrá verla en el listado de discrepancias.',w:1};route();}
if(a==='noenc'){S.msg={t:'Se reportó el documento como no encontrado. Queda visible para la jefatura.',w:1};route();}
if(a==='confirmar'){d.e='Retirado';d.who=S.form.sol;d.desde=HOY;d.h.unshift({f:HOY,x:'Salida registrada: '+S.form.sol});S.msg=null;location.hash='#confirmacion';}
if(a==='comprobante'){S.msg={t:'En este prototipo el comprobante no se descarga.'};route();}});
document.addEventListener('input',e=>{const t=e.target.id;
if(t==='q'&&location.hash==='#resultados'){S.q=e.target.value;relist();}
if(t==='ft'){S.tipo=e.target.value;relist();}if(t==='fe'){S.est=e.target.value;relist();}if(t==='fa'){S.anio=e.target.value;relist();}
if(t==='sol')S.form.sol=e.target.value;if(t==='fec')S.form.fecha=e.target.value;if(t==='mot')S.form.mot=e.target.value;});
document.addEventListener('submit',e=>{e.preventDefault();
if(e.target.id==='fb'){S.q=$('#q').value;S.tipo=S.est=S.anio=S.cas='';location.hash='#resultados';}
if(e.target.id==='fs'){if(!S.form.sol.trim()){S.err='Escriba quién retira el documento.';route();$('#sol').focus();return;}S.err='';location.hash='#resumen';}});
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
